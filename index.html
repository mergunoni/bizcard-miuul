<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mehmet Ergün · Dijital Kartvizit</title>
  <meta name="description" content="Mehmet Ergün'ün dijital kartviziti" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
    Kartviziti kişiselleştirmek için aşağıdaki "data-*" alanlarını ve
    metinleri değiştirmen yeterli. Tüm içerik bu tek blokta.
  -->
  <main class="card" aria-label="Dijital kartvizit">
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Temayı değiştir"
    >
      <!-- İkon script.js tarafından güncellenir -->
      <span class="theme-icon" aria-hidden="true">🌙</span>
    </button>

    <header class="card__header">
      <div class="avatar" aria-hidden="true">ME</div>
      <h1 class="card__name">Mehmet Ergün</h1>
      <p class="card__title">Müzik Telif Uzmanı · MSG</p>
    </header>

    <!-- vCard (.vcf) indirip telefon rehberine ekleme; script.js'te üretilir -->
    <button type="button" class="save-contact" id="save-contact">
      📇 Rehbere Kaydet
    </button>

    <ul class="contact">
      <li class="contact__item">
        <a href="tel:+905357650668" class="contact__link">
          <span class="contact__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </span>
          <span class="contact__text">+90 535 765 06 68</span>
        </a>
      </li>
      <li class="contact__item">
        <a href="mailto:mehmet.ergun@example.com" class="contact__link">
          <span class="contact__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-10 6L2 7"/>
            </svg>
          </span>
          <span class="contact__text">mehmet.ergun@msg.org.tr</span>
        </a>
      </li>
      <li class="contact__item">
        <a href="https://msg.org.tr" class="contact__link"
           target="_blank" rel="noopener">
          <span class="contact__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M2 12h20"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
          </span>
          <span class="contact__text">msg.org.tr</span>
        </a>
      </li>
    </ul>

    <nav class="social" aria-label="Sosyal medya">
      <a href="https://linkedin.com/in/kullanici" class="social__link"
         target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.71h.05c.53-1 1.83-2.06 3.76-2.06 4.02 0 4.76 2.65 4.76 6.09V21h-4v-5.4c0-1.29-.02-2.95-1.8-2.95-1.8 0-2.07 1.4-2.07 2.85V21H9z"/>
        </svg>
      </a>
      <a href="https://x.com/kullanici" class="social__link"
         target="_blank" rel="noopener" aria-label="X">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M18.9 2H22l-7.5 8.57L23.3 22h-6.9l-5.4-7.06L4.8 22H1.7l8.03-9.17L.9 2h7.07l4.88 6.45L18.9 2zm-1.2 18h1.9L7.4 4H5.4z"/>
        </svg>
      </a>
      <a href="https://instagram.com/kullanici" class="social__link"
         target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="https://github.com/kullanici" class="social__link"
         target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M12 2A10 10 0 0 0 8.84 21.5c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.26-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.39.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/>
        </svg>
      </a>
    </nav>

    <!-- Tek form, iki aksiyon: "Kartı Kaydet" ve "Toplantı Talep Et" aynı
         alanları paylaşır; tarih yalnızca toplantı talebinde zorunludur.
         Gönderim mantığı script.js'te. -->
    <form class="lead" id="save-form" novalidate>
      <label class="lead__field">
        <span class="lead__label">Ad Soyad</span>
        <input class="lead__input" type="text" name="name" required
               autocomplete="name" placeholder="Adınız soyadınız" />
      </label>
      <label class="lead__field">
        <span class="lead__label">E-posta</span>
        <input class="lead__input" type="email" name="email" required
               autocomplete="email" placeholder="ornek@eposta.com" />
      </label>
      <label class="lead__field">
        <span class="lead__label">Tercih edilen tarih (toplantı için)</span>
        <!-- "min" (bugün) script.js tarafından atanır: geçmiş tarih seçilemez -->
        <input class="lead__input" type="date" name="preferredDate" />
      </label>
      <div class="lead__actions">
        <button class="lead__submit" type="submit">Kartı Kaydet</button>
        <button class="lead__submit lead__submit--alt" type="button"
                id="meeting-button">Toplantı Talep Et</button>
      </div>
      <p class="lead__status" role="status" aria-live="polite"></p>
    </form>

    <!-- QR kod: canlı deploy URL'ini işaret eder (adres script.js'te) -->
    <section class="qr" aria-label="QR kod ile paylaş">
      <div class="qr__frame" id="qr-code"></div>
      <p class="qr__caption">Kartı paylaşmak için QR'ı okut</p>
    </section>
  </main>

  <!-- QR kod kütüphanesi (qrcodejs) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
