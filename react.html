<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mehmet Ergün · Dijital Kartvizit (React)</title>
  <meta name="description" content="Mehmet Ergün'ün dijital kartviziti" />
  <link rel="stylesheet" href="style.css" />

  <!-- CDN: React, ReactDOM ve Babel (JSX'i tarayıcıda derler). Kurulum gerektirmez.
       Sürümler sabitlendi. Babel 7 kullanılıyor: react preset'i klasik runtime'ı
       (React.createElement) varsayar ve global UMD React ile bu şekilde çalışır.
       Babel 8'in "automatic" runtime'ı "import ... from react/jsx-runtime" üretir,
       klasik <script> içinde çalışmaz ve sayfa boş kalır. -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- QR kod bileşeni: qrcode.react yalnızca ESM olarak dağıtıldığından esm.sh
       üzerinden yüklenir. Global'e yazılıp hazır olduğunda olay tetiklenir;
       aşağıdaki QrCode bileşeni bu olayı dinleyip QR'ı render eder. -->
  <script type="module">
    import { QRCodeSVG } from "https://esm.sh/qrcode.react@3.1.0";
    window.QRCodeSVG = QRCodeSVG;
    window.dispatchEvent(new Event("qrcode-ready"));
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    Tüm uygulama tek dosyada. İçeriği değiştirmek için aşağıdaki "profile"
    nesnesini düzenlemen yeterli.
  -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    /* ===== Canlı deploy adresi (QR kod bunu işaret eder) =====
       Deploy adresi değişirse yalnızca bu sabiti güncelle. */
    const DEPLOY_URL = "https://bizcard-miuul-mehmet24.vercel.app/";

    /* ===== Kart kimliği ve n8n webhook adresi =====
       n8n Webhook (production) URL'ini buraya gir. Yer tutucu kaldıkça
       "Kartı Kaydet" / "Toplantı Talep Et" isteği atılmaz. */
    const CARD_ID = "mehmet-ergun";
    const WEBHOOK_URL = "https://n8n.ornek.com/webhook/bizcard";
    const WEBHOOK_PLACEHOLDER = "https://n8n.ornek.com/webhook/bizcard";

    /* ===== İçerik (tek düzenlenebilir yer) ===== */
    const profile = {
      initials: "ME",
      name: "Mehmet Ergün",
      title: "Müzik Telif Uzmanı · MSG",
      contacts: [
        { type: "phone", label: "+90 555 123 45 67", href: "tel:+905551234567" },
        { type: "mail", label: "mergunoni@gmail.com", href: "mailto:mergunoni@gmail.com" },
        { type: "web", label: "msg.org.tr", href: "https://msg.org.tr" },
      ],
      social: [
        { name: "LinkedIn", href: "https://linkedin.com/in/kullanici" },
        { name: "X", href: "https://x.com/kullanici" },
        { name: "Instagram", href: "https://instagram.com/kullanici" },
        { name: "GitHub", href: "https://github.com/kullanici" },
      ],
    };

    /* ===== SVG ikonları ===== */
    const ContactIcon = ({ type }) => {
      const common = {
        viewBox: "0 0 24 24", width: 20, height: 20, fill: "none",
        stroke: "currentColor", strokeWidth: 2,
        strokeLinecap: "round", strokeLinejoin: "round",
      };
      if (type === "phone") {
        return (
          <svg {...common}>
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        );
      }
      if (type === "mail") {
        return (
          <svg {...common}>
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-10 6L2 7"/>
          </svg>
        );
      }
      return (
        <svg {...common}>
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      );
    };

    const SocialIcon = ({ name }) => {
      if (name === "LinkedIn") {
        return (
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.71h.05c.53-1 1.83-2.06 3.76-2.06 4.02 0 4.76 2.65 4.76 6.09V21h-4v-5.4c0-1.29-.02-2.95-1.8-2.95-1.8 0-2.07 1.4-2.07 2.85V21H9z"/>
          </svg>
        );
      }
      if (name === "X") {
        return (
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M18.9 2H22l-7.5 8.57L23.3 22h-6.9l-5.4-7.06L4.8 22H1.7l8.03-9.17L.9 2h7.07l4.88 6.45L18.9 2zm-1.2 18h1.9L7.4 4H5.4z"/>
          </svg>
        );
      }
      if (name === "Instagram") {
        return (
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        );
      }
      return (
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M12 2A10 10 0 0 0 8.84 21.5c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.26-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.39.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/>
        </svg>
      );
    };

    /* ===== "Rehbere Kaydet": profile'dan vCard (.vcf) üretip indirir ===== */
    // Ad/soyad ayrımı: son boşluğa göre (tek kelimelik isimlerde soyad boş kalır)
    function splitName(fullName) {
      const idx = fullName.lastIndexOf(" ");
      if (idx === -1) return { given: fullName, family: "" };
      return { given: fullName.slice(0, idx), family: fullName.slice(idx + 1) };
    }

    function buildVCard(profile) {
      const name = splitName(profile.name);
      const phone = profile.contacts.find((c) => c.type === "phone");
      const mail = profile.contacts.find((c) => c.type === "mail");
      const web = profile.contacts.find((c) => c.type === "web");

      const lines = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `N:${name.family};${name.given};;;`,
        `FN:${profile.name}`,
      ];
      if (profile.title) lines.push(`TITLE:${profile.title}`);
      if (phone) lines.push(`TEL;TYPE=CELL:${phone.href.replace("tel:", "")}`);
      if (mail) lines.push(`EMAIL:${mail.href.replace("mailto:", "")}`);
      if (web) lines.push(`URL:${web.href}`);
      lines.push("END:VCARD");

      return lines.join("\r\n");
    }

    function downloadVCard(profile) {
      const text = buildVCard(profile);
      const filename =
        profile.name
          .toLowerCase()
          .replace(/[^a-z0-9şıöüğç\s-]/gi, "")
          .trim()
          .replace(/\s+/g, "-") + ".vcf";

      const blob = new Blob([text], { type: "text/vcard" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function SaveContactButton({ profile }) {
      return (
        <button
          type="button"
          className="save-contact"
          onClick={() => downloadVCard(profile)}
        >
          📇 Rehbere Kaydet
        </button>
      );
    }

    /* ===== Bileşen: Avatar ===== */
    function Avatar({ initials }) {
      return <div className="avatar" aria-hidden="true">{initials}</div>;
    }

    /* ===== Bileşen: QrCode =====
       qrcode.react (QRCodeSVG) esm.sh'ten asenkron yüklenir; global hazır
       olunca "qrcode-ready" olayıyla yeniden render edilir. */
    function QrCode({ url }) {
      const [QR, setQR] = useState(() => window.QRCodeSVG || null);

      useEffect(() => {
        if (QR) return;
        const onReady = () => setQR(() => window.QRCodeSVG || null);
        window.addEventListener("qrcode-ready", onReady);
        return () => window.removeEventListener("qrcode-ready", onReady);
      }, [QR]);

      return (
        <section className="qr" aria-label="QR kod ile paylaş">
          <div className="qr__frame">
            {QR && (
              <QR value={url} size={128} bgColor="#ffffff"
                  fgColor="#1f2937" level="M" />
            )}
          </div>
          <p className="qr__caption">Kartı paylaşmak için QR'ı okut</p>
        </section>
      );
    }

    /* ===== Bileşen: LeadForm =====
       Tek form, iki aksiyon: "Kartı Kaydet" (card_saved) ve "Toplantı Talep Et"
       (meeting_request) aynı alanları paylaşır. Tarih yalnızca toplantı
       talebinde zorunludur. */
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // Yerel güne göre "YYYY-MM-DD" (toISOString UTC'ye kaydırdığı için offset düşülür)
    function today() {
      const now = new Date();
      return new Date(now.getTime() - now.getTimezoneOffset() * 60000)
        .toISOString()
        .slice(0, 10);
    }

    function LeadForm({ cardId, webhookUrl }) {
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [preferredDate, setPreferredDate] = useState("");
      const [status, setStatus] = useState("idle"); // idle|sending|success|error
      const [message, setMessage] = useState("");

      const sending = status === "sending";
      // State güncellemeleri asenkron/batch'li olduğundan, senkron art arda
      // (ör. Enter'a hızlı basma) çağrılara karşı ref ile senkron kilit tutulur.
      const sendingRef = useRef(false);

      // type: "card_saved" | "meeting_request"
      async function send(type) {
        // Buton disabled olsa da Enter tuşu formu gönderebildiği için art arda
        // gönderimi burada da engelliyoruz.
        if (sendingRef.current) {
          return;
        }

        if (!name.trim() || !EMAIL_RE.test(email.trim())) {
          setStatus("error");
          setMessage("Lütfen ad ve geçerli bir e-posta gir.");
          return;
        }

        // Tarih yalnızca toplantı talebinde zorunlu; kart kaydında serbest.
        if (type === "meeting_request") {
          if (!preferredDate) {
            setStatus("error");
            setMessage("Toplantı için tercih ettiğin tarihi seç.");
            return;
          }
          // "min" klavyeyle aşılabildiği için gönderimde de kontrol edilir
          if (preferredDate < today()) {
            setStatus("error");
            setMessage("Geçmiş bir tarih seçilemez.");
            return;
          }
        }

        if (webhookUrl === WEBHOOK_PLACEHOLDER) {
          setStatus("error");
          setMessage("Form hazır; n8n webhook URL'i girilince aktif olur.");
          return;
        }

        sendingRef.current = true;
        setStatus("sending");
        setMessage("Gönderiliyor…");

        const envelope = {
          type: type,
          cardId: cardId,
          timestamp: new Date().toISOString(),
          name: name.trim(),
          email: email.trim(),
        };
        const payload =
          type === "meeting_request"
            ? { ...envelope, phone: "", preferredDate: preferredDate, message: "" }
            : { ...envelope, source: "link" };

        try {
          const res = await fetch(webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (res.ok) {
            setName("");
            setEmail("");
            setPreferredDate("");
            setStatus("success");
            setMessage(
              type === "meeting_request"
                ? "Toplantı talebin iletildi."
                : "Teşekkürler! Bilgilerin kaydedildi."
            );
          } else {
            setStatus("error");
            setMessage("Gönderilemedi, lütfen tekrar dene.");
          }
        } catch (err) {
          setStatus("error");
          setMessage("Bağlantı hatası, lütfen tekrar dene.");
        } finally {
          sendingRef.current = false;
        }
      }

      // Enter tuşu ve "Kartı Kaydet" düğmesi formu gönderir
      function handleSubmit(event) {
        event.preventDefault();
        send("card_saved");
      }

      const statusClass =
        "lead__status" +
        (status === "success" ? " lead__status--ok" : "") +
        (status === "error" ? " lead__status--err" : "");

      return (
        <form className="lead" onSubmit={handleSubmit} noValidate>
          <label className="lead__field">
            <span className="lead__label">Ad Soyad</span>
            <input
              className="lead__input"
              type="text"
              name="name"
              required
              autoComplete="name"
              placeholder="Adınız soyadınız"
              value={name}
              onChange={(e) => setName(e.target.value)}
            />
          </label>
          <label className="lead__field">
            <span className="lead__label">E-posta</span>
            <input
              className="lead__input"
              type="email"
              name="email"
              required
              autoComplete="email"
              placeholder="ornek@eposta.com"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
            />
          </label>
          <label className="lead__field">
            <span className="lead__label">Tercih edilen tarih (toplantı için)</span>
            <input
              className="lead__input"
              type="date"
              name="preferredDate"
              min={today()}
              value={preferredDate}
              onChange={(e) => setPreferredDate(e.target.value)}
            />
          </label>
          <p className="lead__privacy">
            Formu göndererek{" "}
            <a href="privacy.html" target="_blank" rel="noopener">
              KVKK Aydınlatma Metni
            </a>
            'ni kabul etmiş olursunuz.
          </p>
          <div className="lead__actions">
            <button className="lead__submit" type="submit" disabled={sending}>
              Kartı Kaydet
            </button>
            <button
              className="lead__submit lead__submit--alt"
              type="button"
              disabled={sending}
              onClick={() => send("meeting_request")}
            >
              Toplantı Talep Et
            </button>
          </div>
          <p className={statusClass} role="status" aria-live="polite">
            {message}
          </p>
        </form>
      );
    }

    /* ===== Bileşen: ContactList ===== */
    function ContactList({ contacts }) {
      return (
        <ul className="contact">
          {contacts.map((c) => {
            const external = c.href.startsWith("http");
            return (
              <li className="contact__item" key={c.href}>
                <a
                  className="contact__link"
                  href={c.href}
                  {...(external ? { target: "_blank", rel: "noopener" } : {})}
                >
                  <span className="contact__icon" aria-hidden="true">
                    <ContactIcon type={c.type} />
                  </span>
                  <span className="contact__text">{c.label}</span>
                </a>
              </li>
            );
          })}
        </ul>
      );
    }

    /* ===== Bileşen: ProfilCard ===== */
    function ProfilCard({ profile }) {
      const [theme, setTheme] = useState("light");

      // Açılışta tema: kayıtlı tercih > sistem tercihi > açık
      useEffect(() => {
        const saved = localStorage.getItem("bizcard-theme");
        if (saved === "light" || saved === "dark") {
          setTheme(saved);
        } else if (window.matchMedia &&
                   window.matchMedia("(prefers-color-scheme: dark)").matches) {
          setTheme("dark");
        }
      }, []);

      // Tema değiştikçe belgeye uygula
      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
      }, [theme]);

      const toggleTheme = () => {
        const next = theme === "dark" ? "light" : "dark";
        setTheme(next);
        localStorage.setItem("bizcard-theme", next);
      };

      return (
        <main className="card" aria-label="Dijital kartvizit">
          <button
            type="button"
            className="theme-toggle"
            onClick={toggleTheme}
            aria-label={theme === "dark" ? "Açık temaya geç" : "Koyu temaya geç"}
          >
            <span className="theme-icon" aria-hidden="true">
              {theme === "dark" ? "☀️" : "🌙"}
            </span>
          </button>

          <header className="card__header">
            <Avatar initials={profile.initials} />
            <h1 className="card__name">{profile.name}</h1>
            <p className="card__title">{profile.title}</p>
          </header>

          <ContactList contacts={profile.contacts} />

          <nav className="social" aria-label="Sosyal medya">
            {profile.social.map((s) => (
              <a
                key={s.href}
                className="social__link"
                href={s.href}
                target="_blank"
                rel="noopener"
                aria-label={s.name}
              >
                <SocialIcon name={s.name} />
              </a>
            ))}
          </nav>

          <LeadForm cardId={CARD_ID} webhookUrl={WEBHOOK_URL} />

          <SaveContactButton profile={profile} />

          <QrCode url={DEPLOY_URL} />
        </main>
      );
    }

    /* ===== Kök ===== */
    ReactDOM.createRoot(document.getElementById("root"))
      .render(<ProfilCard profile={profile} />);
  </script>
</body>
</html>
