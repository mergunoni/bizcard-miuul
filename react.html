<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mehmet Ergün · Dijital Kartvizit (React)</title>
  <meta name="description" content="Mehmet Ergün'ün dijital kartviziti" />
  <link rel="stylesheet" href="style.css" />

  <!-- CDN: React, ReactDOM ve Babel (JSX'i tarayıcıda derler). Kurulum gerektirmez.
       Sürümler sabitlendi. Babel 7 kullanılıyor: react preset'i klasik runtime'ı
       (React.createElement) varsayar ve global UMD React ile bu şekilde çalışır.
       Babel 8'in "automatic" runtime'ı "import ... from react/jsx-runtime" üretir,
       klasik <script> içinde çalışmaz ve sayfa boş kalır. -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- QR kod bileşeni: qrcode.react yalnızca ESM olarak dağıtıldığından esm.sh
       üzerinden yüklenir. Global'e yazılıp hazır olduğunda olay tetiklenir;
       aşağıdaki QrCode bileşeni bu olayı dinleyip QR'ı render eder. -->
  <script type="module">
    import { QRCodeSVG } from "https://esm.sh/qrcode.react@3.1.0";
    window.QRCodeSVG = QRCodeSVG;
    window.dispatchEvent(new Event("qrcode-ready"));
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    Tüm uygulama tek dosyada. İçeriği değiştirmek için aşağıdaki "profile"
    nesnesini düzenlemen yeterli.
  -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    /* ===== Canlı deploy adresi (QR kod bunu işaret eder) =====
       Deploy adresi değişirse yalnızca bu sabiti güncelle. */
    const DEPLOY_URL = "https://mergunoni.github.io/bizcard-miuul/";

    /* ===== İçerik (tek düzenlenebilir yer) ===== */
    const profile = {
      initials: "ME",
      name: "Mehmet Ergün",
      title: "Müzik Telif Uzmanı · MSG",
      contacts: [
        { type: "phone", label: "+90 555 123 45 67", href: "tel:+905551234567" },
        { type: "mail", label: "mehmet.ergun@msg.org.tr", href: "mailto:mehmet.ergun@example.com" },
        { type: "web", label: "msg.org.tr", href: "https://msg.org.tr" },
      ],
      social: [
        { name: "LinkedIn", href: "https://linkedin.com/in/kullanici" },
        { name: "X", href: "https://x.com/kullanici" },
        { name: "Instagram", href: "https://instagram.com/kullanici" },
        { name: "GitHub", href: "https://github.com/kullanici" },
      ],
    };

    /* ===== SVG ikonları ===== */
    const ContactIcon = ({ type }) => {
      const common = {
        viewBox: "0 0 24 24", width: 20, height: 20, fill: "none",
        stroke: "currentColor", strokeWidth: 2,
        strokeLinecap: "round", strokeLinejoin: "round",
      };
      if (type === "phone") {
        return (
          <svg {...common}>
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        );
      }
      if (type === "mail") {
        return (
          <svg {...common}>
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-10 6L2 7"/>
          </svg>
        );
      }
      return (
        <svg {...common}>
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      );
    };

    const SocialIcon = ({ name }) => {
      if (name === "LinkedIn") {
        return (
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.71h.05c.53-1 1.83-2.06 3.76-2.06 4.02 0 4.76 2.65 4.76 6.09V21h-4v-5.4c0-1.29-.02-2.95-1.8-2.95-1.8 0-2.07 1.4-2.07 2.85V21H9z"/>
          </svg>
        );
      }
      if (name === "X") {
        return (
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M18.9 2H22l-7.5 8.57L23.3 22h-6.9l-5.4-7.06L4.8 22H1.7l8.03-9.17L.9 2h7.07l4.88 6.45L18.9 2zm-1.2 18h1.9L7.4 4H5.4z"/>
          </svg>
        );
      }
      if (name === "Instagram") {
        return (
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        );
      }
      return (
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M12 2A10 10 0 0 0 8.84 21.5c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.26-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.39.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/>
        </svg>
      );
    };

    /* ===== Bileşen: Avatar ===== */
    function Avatar({ initials }) {
      return <div className="avatar" aria-hidden="true">{initials}</div>;
    }

    /* ===== Bileşen: QrCode =====
       qrcode.react (QRCodeSVG) esm.sh'ten asenkron yüklenir; global hazır
       olunca "qrcode-ready" olayıyla yeniden render edilir. */
    function QrCode({ url }) {
      const [QR, setQR] = useState(() => window.QRCodeSVG || null);

      useEffect(() => {
        if (QR) return;
        const onReady = () => setQR(() => window.QRCodeSVG || null);
        window.addEventListener("qrcode-ready", onReady);
        return () => window.removeEventListener("qrcode-ready", onReady);
      }, [QR]);

      return (
        <section className="qr" aria-label="QR kod ile paylaş">
          <div className="qr__frame">
            {QR && (
              <QR value={url} size={128} bgColor="#ffffff"
                  fgColor="#1f2937" level="M" />
            )}
          </div>
          <p className="qr__caption">Kartı paylaşmak için QR'ı okut</p>
        </section>
      );
    }

    /* ===== Bileşen: ContactList ===== */
    function ContactList({ contacts }) {
      return (
        <ul className="contact">
          {contacts.map((c) => {
            const external = c.href.startsWith("http");
            return (
              <li className="contact__item" key={c.href}>
                <a
                  className="contact__link"
                  href={c.href}
                  {...(external ? { target: "_blank", rel: "noopener" } : {})}
                >
                  <span className="contact__icon" aria-hidden="true">
                    <ContactIcon type={c.type} />
                  </span>
                  <span className="contact__text">{c.label}</span>
                </a>
              </li>
            );
          })}
        </ul>
      );
    }

    /* ===== Bileşen: ProfilCard ===== */
    function ProfilCard({ profile }) {
      const [theme, setTheme] = useState("light");

      // Açılışta tema: kayıtlı tercih > sistem tercihi > açık
      useEffect(() => {
        const saved = localStorage.getItem("bizcard-theme");
        if (saved === "light" || saved === "dark") {
          setTheme(saved);
        } else if (window.matchMedia &&
                   window.matchMedia("(prefers-color-scheme: dark)").matches) {
          setTheme("dark");
        }
      }, []);

      // Tema değiştikçe belgeye uygula
      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
      }, [theme]);

      const toggleTheme = () => {
        const next = theme === "dark" ? "light" : "dark";
        setTheme(next);
        localStorage.setItem("bizcard-theme", next);
      };

      return (
        <main className="card" aria-label="Dijital kartvizit">
          <button
            type="button"
            className="theme-toggle"
            onClick={toggleTheme}
            aria-label={theme === "dark" ? "Açık temaya geç" : "Koyu temaya geç"}
          >
            <span className="theme-icon" aria-hidden="true">
              {theme === "dark" ? "☀️" : "🌙"}
            </span>
          </button>

          <header className="card__header">
            <Avatar initials={profile.initials} />
            <h1 className="card__name">{profile.name}</h1>
            <p className="card__title">{profile.title}</p>
          </header>

          <ContactList contacts={profile.contacts} />

          <nav className="social" aria-label="Sosyal medya">
            {profile.social.map((s) => (
              <a
                key={s.href}
                className="social__link"
                href={s.href}
                target="_blank"
                rel="noopener"
                aria-label={s.name}
              >
                <SocialIcon name={s.name} />
              </a>
            ))}
          </nav>

          <QrCode url={DEPLOY_URL} />
        </main>
      );
    }

    /* ===== Kök ===== */
    ReactDOM.createRoot(document.getElementById("root"))
      .render(<ProfilCard profile={profile} />);
  </script>
</body>
</html>
